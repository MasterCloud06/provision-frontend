# La tienda como sitio estático en Render.
# En Render: New → Blueprint → elige este repo. Cada cambio en main se publica solo.
services:
  - type: web
    name: provision-tienda
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # La API del servidor de desarrollo (también está en .env.production)
    envVars:
      - key: VITE_API_URL
        value: https://provision-backend-ib50.onrender.com/api/v1
    # Todas las rutas (/carrito, /pedidos/…) las resuelve la tienda
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Los archivos compilados llevan su versión en el nombre: se pueden guardar en caché por un año
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html siempre se revalida: así una publicación nueva llega sin esperar a que caduque la caché.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Seguridad (auditoría MEDIO-17). connect-src: solo la API. Al pasar a ENAI se cambia aquí junto con
      # VITE_API_URL; mientras tanto se permiten las dos. Las fotos son https (ENAI); el pago con Stripe es
      # una redirección (navegación), no la limita la CSP.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://provision-backend-ib50.onrender.com https://enai-api.onrender.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
