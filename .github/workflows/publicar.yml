# Cada cambio en main: revisa, prueba, compila y publica la tienda en GitHub Pages (rama gh-pages).
name: Publicar tienda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Compilar
        env:
          # La tienda vive en https://<usuario>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Opcional: define la variable API_URL en Settings → Secrets and variables → Actions → Variables
          VITE_API_URL: ${{ vars.API_URL || 'https://provision-backend-ib50.onrender.com/api/v1' }}
        run: npm run build

      - name: Publicar en la rama gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Tienda publicada desde ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
